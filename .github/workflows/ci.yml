name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `npm ci` and nothing else. This used to read `npm ci || npm install`,
      # which meant a lockfile that had drifted out of sync with package.json
      # was repaired in place and the run went green — so the one failure the
      # lockfile exists to catch was the one failure CI could not report.
      - name: Install
        run: npm ci

      - name: Dependency audit
        run: npm audit

      - name: Typecheck
        run: npx tsc --noEmit

      # Blocking, like every other step here. There was a `lint` script pointing
      # at `next lint` with no ESLint installed and no config, so it fell into an
      # interactive setup prompt; nothing in CI called it, so nobody found out.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The credential setup script shipped with its own tests, and nothing ran
      # them — not `npm test`, whose chain stops at the worker suite, and not
      # this workflow. They passed, so nobody found out they were decorative.
      # Blocking, like every other step here. Kept out of `npm test` on purpose:
      # that is the README's quickstart and it should not start needing Python.
      - name: Test setup script
        run: npm run test:setup-script

      - name: Build
        run: npm run build

  self-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Compose contract
        env:
          EDITFORGE_ACCESS_PASSWORD: ci-access-password
          EDITFORGE_SESSION_SECRET: ci-session-secret
          EDITFORGE_MCP_TOKEN: ci-mcp-token
          EDITFORGE_WORKER_TOKEN: ci-worker-token
          EDITFORGE_PROVIDER_TOKEN: ci-provider-token
          EDITFORGE_PUBLIC_URL: http://localhost:3100
          EDITFORGE_IDENTITY_REGISTRY_FILE: ./provider/identity-registry.example.json
          EDITFORGE_PROVIDER_MAX_CREDITS_PER_JOB: "100"
        run: docker compose config --quiet

      # The local DEVON stack. It is the Compose file a contributor is most
      # likely to edit and least likely to boot, so it gets the same contract
      # check, with only the four access credentials set, which is the point of
      # it: no provider token, no identity registry.
      - name: Local compose contract
        env:
          EDITFORGE_ACCESS_PASSWORD: ci-access-password
          EDITFORGE_SESSION_SECRET: ci-session-secret
          EDITFORGE_MCP_TOKEN: ci-mcp-token
          EDITFORGE_WORKER_TOKEN: ci-worker-token
        run: docker compose -f compose.local.yaml config --quiet

      - name: Build control plane image
        run: docker build -f infrastructure/web/Dockerfile -t editforge-web-ci .

      - name: Build render worker image
        run: docker build -f infrastructure/worker/Dockerfile -t editforge-worker-ci .

      - name: Build provider adapter image
        run: docker build -f infrastructure/provider/Dockerfile -t editforge-provider-ci .
