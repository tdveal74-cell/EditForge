# Hostinger production topology for release 648c73d83e74.
# Live runtime on the VPS is /opt/editforge/app/compose.yaml with the same pins.
# Application data volumes are external so project replacement cannot remove them.
# The init job makes root-owned mode-0600 identity inputs readable by the non-root provider.
name: editforge

services:
  web:
    image: ghcr.io/tdveal74-cell/editforge-web:648c73d83e74
    pull_policy: always
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      EDITFORGE_DATA_DIR: /data
      EDITFORGE_SESSION_SECRET: ${EDITFORGE_SESSION_SECRET:?set EDITFORGE_SESSION_SECRET}
      EDITFORGE_PASSKEY_RP_ID: ${EDITFORGE_PASSKEY_RP_ID:-editforge.online}
      EDITFORGE_PASSKEY_ORIGIN: ${EDITFORGE_PASSKEY_ORIGIN:-https://editforge.online}
      EDITFORGE_PASSKEY_NAME: ${EDITFORGE_PASSKEY_NAME:-EditForge}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
      EDITFORGE_GOOGLE_ALLOWED_EMAIL: ${EDITFORGE_GOOGLE_ALLOWED_EMAIL:?set EDITFORGE_GOOGLE_ALLOWED_EMAIL}
      EDITFORGE_GOOGLE_REDIRECT_ORIGIN: ${EDITFORGE_GOOGLE_REDIRECT_ORIGIN:-https://editforge.online}
      EDITFORGE_MCP_TOKEN: ${EDITFORGE_MCP_TOKEN:?set EDITFORGE_MCP_TOKEN}
      EDITFORGE_WORKER_URL: http://worker:8787
      EDITFORGE_WORKER_TOKEN: ${EDITFORGE_WORKER_TOKEN:?set EDITFORGE_WORKER_TOKEN}
      EDITFORGE_WORKER_CALLBACK_BASE_URL: http://web:3000
      EDITFORGE_ARTIFACT_DIR: /artifacts
      EDITFORGE_SOURCE_MEDIA_DIR: /sources
      EDITFORGE_PUBLIC_URL: ${EDITFORGE_PUBLIC_URL:?set EDITFORGE_PUBLIC_URL}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_AGENT_MODEL: ${XAI_AGENT_MODEL:-grok-4.6}
      RUNWAY_API_KEY: ${RUNWAY_API_KEY:-${RUNWAYML_API_SECRET:-}}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_VOICE_ID_AUREN: ${ELEVENLABS_VOICE_ID_AUREN:-}
      ELEVENLABS_VOICE_ID_VESPERA: ${ELEVENLABS_VOICE_ID_VESPERA:-}
      ELEVENLABS_VOICE_ID_STOCK_NARRATOR: ${ELEVENLABS_VOICE_ID_STOCK_NARRATOR:-}
      HEYGEN_API_KEY: ${HEYGEN_API_KEY:-}
      HEYGEN_AVATAR_ID: ${HEYGEN_AVATAR_ID:-}
      HEYGEN_VOICE_ID: ${HEYGEN_VOICE_ID:-}
    ports:
      - "127.0.0.1:${EDITFORGE_PORT:-3000}:3000"
    volumes:
      - editforge_web_data:/data
      - editforge_artifacts:/artifacts
      - ${EDITFORGE_SOURCE_MEDIA_HOST_DIR:-./media}:/sources:ro
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks: [control, render]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  worker:
    image: ghcr.io/tdveal74-cell/editforge-worker:648c73d83e74
    pull_policy: always
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      EDITFORGE_WORK_DIR: /data
      EDITFORGE_WORKER_TOKEN: ${EDITFORGE_WORKER_TOKEN:?set EDITFORGE_WORKER_TOKEN}
      EDITFORGE_CALLBACK_ORIGIN: http://web:3000
      EDITFORGE_WORKER_CONCURRENCY: ${EDITFORGE_WORKER_CONCURRENCY:-1}
      EDITFORGE_PROVIDER_HEALTH_URL: http://provider:9080/health
      EDITFORGE_PROVIDER_TOKEN: ${EDITFORGE_PROVIDER_TOKEN:-}
      EDITFORGE_VOICE_ADAPTER_URL: ${EDITFORGE_VOICE_ADAPTER_URL:-http://provider:9080/v1/voice}
      EDITFORGE_MOTION_ADAPTER_URL: ${EDITFORGE_MOTION_ADAPTER_URL:-http://provider:9080/v1/motion}
      EDITFORGE_LIPSYNC_ADAPTER_URL: ${EDITFORGE_LIPSYNC_ADAPTER_URL:-http://provider:9080/v1/lipsync}
      EDITFORGE_TIMELINE_ADAPTER_URL: ${EDITFORGE_TIMELINE_ADAPTER_URL:-}
      EDITFORGE_ARTIFACT_DIR: /artifacts
      EDITFORGE_SOURCE_MEDIA_DIR: /sources
      EDITFORGE_ARTIFACT_BASE_URL: ${EDITFORGE_PUBLIC_URL:?set EDITFORGE_PUBLIC_URL}/api/artifacts
      EDITFORGE_TRUSTED_MEDIA_ORIGINS: http://provider:9080
    volumes:
      - editforge_worker_data:/data
      - editforge_artifacts:/artifacts
      - ${EDITFORGE_SOURCE_MEDIA_HOST_DIR:-./media}:/sources:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks: [render]
    depends_on:
      provider:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  identity-init:
    image: busybox:1.37.0
    pull_policy: always
    restart: "no"
    init: true
    network_mode: none
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        cp /source/editforge-identities.json /runtime/editforge-identities.json
        cp /source/tee-runway-clone-reference.png /runtime/tee-runway-clone-reference.png
        chmod 0444 /runtime/editforge-identities.json /runtime/tee-runway-clone-reference.png
    volumes:
      - ${EDITFORGE_IDENTITY_REGISTRY_FILE:?set EDITFORGE_IDENTITY_REGISTRY_FILE}:/source/editforge-identities.json:ro
      - ${EDITFORGE_RUNWAY_CHARACTER_FILE:?set EDITFORGE_RUNWAY_CHARACTER_FILE}:/source/tee-runway-clone-reference.png:ro
      - editforge_identity_runtime:/runtime
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "1" }

  provider:
    image: ghcr.io/tdveal74-cell/editforge-provider:648c73d83e74
    pull_policy: always
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      identity-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      EDITFORGE_PROVIDER_TOKEN: ${EDITFORGE_PROVIDER_TOKEN:?set EDITFORGE_PROVIDER_TOKEN}
      EDITFORGE_IDENTITY_REGISTRY_FILE: /run/secrets/editforge-identities.json
      EDITFORGE_PROVIDER_ARTIFACT_DIR: /provider-artifacts
      EDITFORGE_PROVIDER_ARTIFACT_BASE_URL: http://provider:9080/artifacts
      EDITFORGE_PROVIDER_MAX_CREDITS_PER_JOB: ${EDITFORGE_PROVIDER_MAX_CREDITS_PER_JOB:?set EDITFORGE_PROVIDER_MAX_CREDITS_PER_JOB}
      EDITFORGE_VOICE_MAX_CHARACTERS_PER_JOB: ${EDITFORGE_VOICE_MAX_CHARACTERS_PER_JOB:-5000}
      RUNWAYML_API_SECRET: ${RUNWAYML_API_SECRET:-}
      RUNWAY_API_VERSION: ${RUNWAY_API_VERSION:-2024-11-06}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    volumes:
      - editforge_provider_artifacts:/provider-artifacts
      - editforge_identity_runtime:/run/secrets:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9080/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks: [render]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  edge:
    image: caddy:2.10.2-alpine
    pull_policy: always
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    command: ["caddy", "reverse-proxy", "--from", "${EDITFORGE_DOMAIN:-editforge.online}", "--to", "http://web:3000"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - editforge_caddy_data:/data
      - editforge_caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [control]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  editforge_web_data:
    external: true
    name: editforge_editforge_web_data
  editforge_worker_data:
    external: true
    name: editforge_editforge_worker_data
  editforge_artifacts:
    external: true
    name: editforge_editforge_artifacts
  editforge_provider_artifacts:
    external: true
    name: editforge_editforge_provider_artifacts
  editforge_identity_runtime:
    name: editforge_identity_runtime
  editforge_caddy_data:
    name: editforge_caddy_data
  editforge_caddy_config:
    name: editforge_caddy_config

networks:
  control:
  render:
