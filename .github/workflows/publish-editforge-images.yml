name: Publish EditForge images

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit or ref to publish
        required: true
        default: 83f9254f71f3e10cdfa8a930638c81080489b494
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-editforge-images.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: editforge-image-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: infrastructure/web/Dockerfile
            image: editforge-web
          - service: worker
            dockerfile: infrastructure/worker/Dockerfile
            image: editforge-worker
          - service: provider
            dockerfile: infrastructure/provider/Dockerfile
            image: editforge-provider

    steps:
      - name: Check out pinned source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || '83f9254f71f3e10cdfa8a930638c81080489b494' }}

      - name: Resolve immutable tag
        id: source
        shell: bash
        run: |
          echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/tdveal74-cell/${{ matrix.image }}:${{ steps.source.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/tdveal74-cell/EditForge
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true
