services:
  web:
    image: editforge-web:local-google-callback-20260921T053253Z
    pull_policy: never
    environment:
      HOSTNAME: 0.0.0.0
      EDITFORGE_LOCAL_TOOLS_URL: http://172.16.8.1:3410
      EDITFORGE_PROVIDER_TOKEN: ${EDITFORGE_PROVIDER_TOKEN:?set EDITFORGE_PROVIDER_TOKEN}
      EDITFORGE_RUNWAY_CHARACTER_FILE: /run/presenter/tee-primary.png

    volumes:
      - /opt/editforge/presenter-broll/references/tee-primary.png:/run/presenter/tee-primary.png:ro

    networks:
      - control
      - render
      - local_tools

networks:
  local_tools:
    external: true
    name: editforge_local_tools
