name: Deploy EditForge to Hostinger

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 12-character GHCR tag (git short SHA)
        required: true
        type: string
      confirm:
        description: Type the same image_tag again to authorize a live write
        required: true
        type: string
      dry_run:
        description: Probe and print pins only; do not rewrite or recreate
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

concurrency:
  group: editforge-hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Hostinger tag swap
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out deploy scripts
        uses: actions/checkout@v4

      - name: Reject mismatched confirmation
        env:
          TAG: ${{ inputs.image_tag }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[0-9a-f]{12}$ ]]; then
            echo "image_tag must be a 12-character lowercase hex SHA" >&2
            exit 1
          fi
          if [[ "$CONFIRM" != "$TAG" ]]; then
            echo "confirm must exactly equal image_tag" >&2
            exit 1
          fi

      - name: Require VPS secrets
        env:
          HOST: ${{ secrets.EDITFORGE_VPS_HOST }}
          USER: ${{ secrets.EDITFORGE_VPS_USER }}
          KEY: ${{ secrets.EDITFORGE_VPS_SSH_KEY }}
          DIR: ${{ secrets.EDITFORGE_COMPOSE_DIR }}
        run: |
          set -euo pipefail
          missing=0
          [[ -n "$HOST" ]] || { echo "missing secret EDITFORGE_VPS_HOST" >&2; missing=1; }
          [[ -n "$USER" ]] || { echo "missing secret EDITFORGE_VPS_USER" >&2; missing=1; }
          [[ -n "$KEY" ]] || { echo "missing secret EDITFORGE_VPS_SSH_KEY" >&2; missing=1; }
          [[ -n "$DIR" ]] || { echo "missing secret EDITFORGE_COMPOSE_DIR" >&2; missing=1; }
          if [[ "$missing" -ne 0 ]]; then
            echo "Add those under Settings → Secrets and variables → Actions." >&2
            echo "Optional: EDITFORGE_VPS_PORT, EDITFORGE_COMPOSE_FILE, EDITFORGE_HEALTH_URL, EDITFORGE_VPS_SSH_KNOWN_HOSTS." >&2
            exit 1
          fi

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm published images exist
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          for service in web worker provider; do
            image="ghcr.io/tdveal74-cell/editforge-${service}:${TAG}"
            echo "inspect $image"
            docker buildx imagetools inspect "$image" >/dev/null
          done

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EDITFORGE_VPS_SSH_KEY }}

      - name: Trust host key
        env:
          HOST: ${{ secrets.EDITFORGE_VPS_HOST }}
          PORT: ${{ secrets.EDITFORGE_VPS_PORT }}
          KNOWN: ${{ secrets.EDITFORGE_VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [[ -n "$KNOWN" ]]; then
            printf '%s\n' "$KNOWN" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Copy swap script
        env:
          HOST: ${{ secrets.EDITFORGE_VPS_HOST }}
          USER: ${{ secrets.EDITFORGE_VPS_USER }}
          PORT: ${{ secrets.EDITFORGE_VPS_PORT }}
        run: |
          set -euo pipefail
          scp -P "${PORT:-22}" scripts/hostinger-tag-swap.sh \
            "${USER}@${HOST}:/tmp/editforge-hostinger-tag-swap.sh"
          ssh -p "${PORT:-22}" "${USER}@${HOST}" \
            "chmod 700 /tmp/editforge-hostinger-tag-swap.sh"

      - name: Run tag swap
        env:
          HOST: ${{ secrets.EDITFORGE_VPS_HOST }}
          USER: ${{ secrets.EDITFORGE_VPS_USER }}
          PORT: ${{ secrets.EDITFORGE_VPS_PORT }}
          DIR: ${{ secrets.EDITFORGE_COMPOSE_DIR }}
          FILE: ${{ secrets.EDITFORGE_COMPOSE_FILE }}
          HEALTH: ${{ secrets.EDITFORGE_HEALTH_URL }}
          TAG: ${{ inputs.image_tag }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          compose_file="${FILE:-compose.hostinger.yaml}"
          health="${HEALTH:-https://editforge.online/api/health}"
          remote_compose="${DIR%/}/${compose_file}"
          if [[ "$DRY" == "true" ]]; then
            extra=(--dry-run)
          else
            extra=(--apply --health-url "$health")
          fi
          ssh -p "${PORT:-22}" "${USER}@${HOST}" \
            "bash /tmp/editforge-hostinger-tag-swap.sh --tag '$TAG' --compose-file '$remote_compose' ${extra[*]}"
